spring:
  application:
    name: RamichanStore Backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RamichanStoreDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_APPLICATION_LOCAL_YML_MIN_64_BYTES_LONG_RANDOM_SECRET_0000000000}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ramichanstore.backend: DEBUG
