spring:
  application:
    name: RamichanStore Backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RamichanStoreDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_APPLICATION_LOCAL_YML_MIN_64_BYTES_LONG_RANDOM_SECRET_0000000000}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  izipay:
    # Pago con Yape en el checkout del catálogo público (Fase 37). Las 4 credenciales
    # vienen del Back Office Vendedor de Izipay (sección "Desarrolladores") — username
    # es el "Código de comercio", password es la "Clave de API del botón de pagos".
    # api-base-url apunta al ambiente de pruebas (sandbox) por defecto; NUNCA pegar
    # credenciales reales acá — van en application-local.yml (gitignored) o env vars.
    username: ${IZIPAY_USERNAME:}
    password: ${IZIPAY_PASSWORD:}
    public-key: ${IZIPAY_PUBLIC_KEY:}
    hmac-sha256-key: ${IZIPAY_HMAC_SHA256_KEY:}
    # Misma URL para sandbox y producción — lo que cambia es el par username/password
    # (Izipay distingue el ambiente por las credenciales, no por la URL).
    api-base-url: ${IZIPAY_API_BASE_URL:https://api.micuentaweb.pe}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ramichanstore.backend: DEBUG
