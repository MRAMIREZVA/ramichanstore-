server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip: el bundle inicial ronda ~525kB, vale la pena comprimirlo en tránsito.
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Todo lo que empieza con /api va al backend (mismo origen desde el navegador,
    # por eso environment.production.ts usa apiBaseUrl: '/api' sin host).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8M;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (Angular Router resuelve /productos, /portal, etc. en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ngsw.json/ngsw-worker.js (PWA) NUNCA deben cachearse — es justo lo que el service worker
    # instalado revisa para detectar una versión nueva (PwaUpdateService.checkForUpdate). Si
    # quedan cacheados, un cliente con la app ya instalada puede tardar días en enterarse de un
    # deploy nuevo. Van ANTES de la regla de abajo porque nginx usa la primera location que matchea.
    location ~* ^/(ngsw\.json|ngsw-worker\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # index.html tampoco debe cachearse — sin esta regla, nginx solo manda Last-Modified/ETag (sin
    # Cache-Control/Expires), y algunos navegadores igual aplican caché heurística para HTML sin
    # cabeceras explícitas (crece con el tiempo desde el último deploy). `location =` (match exacto,
    # máxima prioridad en nginx) alcanza tanto un GET directo a /index.html como el fallback interno
    # de `try_files ... /index.html` de más abajo (ese fallback SÍ re-evalúa las location de nginx).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El resto de JS/CSS con hash en el nombre (outputHashing: all) sí puede cachearse agresivo
    # — un cambio de contenido siempre implica un nombre de archivo distinto.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
