# Fase 46: WhatsApp/Facebook/etc. arman la tarjeta de vista previa de un link leyendo el
# HTML crudo del primer GET, SIN ejecutar JavaScript — nunca ven los meta tags que Angular
# arma en el navegador, así que compartir un producto siempre mostraba el logo/descripción
# genérica de toda la web. Este `map` detecta esos bots por User-Agent para que la location
# de abajo los mande, SOLO a ellos, al endpoint del backend que arma HTML con el
# nombre/precio/foto reales del producto — un visitante humano nunca pasa por acá, sigue
# recibiendo la SPA de siempre.
#
# Fase 81: se agregan Googlebot/bingbot/DuckDuckBot — mismo problema de fondo (SEO, no solo
# tarjetas para compartir): "Google-InspectionTool" (ya estaba) es la herramienta de inspección
# MANUAL de Search Console, no el crawler real que indexa de verdad. Google sí ejecuta JS al
# indexar (a diferencia de los bots de vista previa de arriba), pero en una segunda pasada que
# puede demorar o despriorizarse en un sitio nuevo/de poca autoridad — darle de entrada un HTML
# con title/meta/canonical/datos estructurados reales (ver CatalogController) no tiene contra,
# y Bing históricamente renderiza JS peor que Google.
map $http_user_agent $is_social_bot {
    default 0;
    "~*facebookexternalhit" 1;
    "~*WhatsApp" 1;
    "~*Twitterbot" 1;
    "~*LinkedInBot" 1;
    "~*TelegramBot" 1;
    "~*Slackbot" 1;
    "~*Discordbot" 1;
    "~*Pinterest" 1;
    "~*redditbot" 1;
    "~*SkypeUriPreview" 1;
    "~*Google-InspectionTool" 1;
    "~*Googlebot" 1;
    "~*bingbot" 1;
    "~*DuckDuckBot" 1;
}

# El id se extrae acá, en un `map` sobre $uri, en vez de con un grupo de captura de la
# propia `location ~ regex` de abajo — un `if` DENTRO de una `location` con regex abre un
# contexto nuevo donde nginx puede perder el valor de `$1` (gotcha documentado de nginx:
# "if is evil"/captures). Confirmado en producción: con `$1` el `proxy_pass` armaba mal la
# URL final y el backend devolvía 401 en vez de la vista previa. Una variable de `map` no
# tiene ese problema — vive fuera de cualquier contexto de `if`.
# OJO: el nombre del grupo de captura NO puede ser "pid" — es una variable RESERVADA de
# nginx (el directive `pid` del proceso maestro) y colisiona con ella incluso dentro de un
# `map` ajeno; nginx ni siquiera arranca ("duplicate pid variable"), tumbando el sitio
# entero (Fase 46, incidente real en producción — revertido y corregido en minutos).
map $uri $catalog_preview_id {
    default "";
    "~^/catalogo/(?<catid>\d+)$" $catid;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip: el bundle inicial ronda ~525kB, vale la pena comprimirlo en tránsito.
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Todo lo que empieza con /api va al backend (mismo origen desde el navegador,
    # por eso environment.production.ts usa apiBaseUrl: '/api' sin host).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8M;
    }

    # Detalle de producto (/catalogo/123): si el visitante es uno de los bots del $is_social_bot
    # de arriba, se sirve la vista previa armada por el backend en vez de la SPA — un `if` con
    # un solo `proxy_pass` adentro es uno de los pocos usos de `if` en location que nginx
    # documenta como seguros (no mezcla con rewrite/return ni con otro `if`). El resto de
    # visitantes (humanos) sigue cayendo al `location /` de abajo con normalidad.
    location ~ ^/catalogo/\d+$ {
        if ($is_social_bot = 1) {
            proxy_pass http://backend:8080/api/catalog/products/$catalog_preview_id/preview;
        }
        try_files $uri /index.html;
    }

    # Fase 81: mismo mecanismo que arriba, para la raíz del catálogo — antes CUALQUIER buscador
    # que pidiera /catalogo recibía el shell genérico de index.html (mismo title/meta para todo
    # el sitio). `location =` (match exacto) solo alcanza a "/catalogo" tal cual, nunca
    # "/catalogo/123" (ya cubierto arriba) ni "/catalogo/carrito" (cae a la SPA de siempre).
    location = /catalogo {
        if ($is_social_bot = 1) {
            proxy_pass http://backend:8080/api/catalog/home-preview;
        }
        try_files $uri /index.html;
    }

    # Fase 81: sitemap.xml real (antes caía al shell de la SPA, igual que cualquier ruta sin
    # archivo físico) — se arma dinámicamente en el backend a partir de los productos reales,
    # así que siempre refleja el catálogo vigente sin tocar este archivo. La URL en la raíz
    # (no /api/catalog/sitemap.xml) es la convención que Google/Bing esperan por defecto.
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/catalog/sitemap.xml;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (Angular Router resuelve /productos, /portal, etc. en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ngsw.json/ngsw-worker.js (PWA) NUNCA deben cachearse — es justo lo que el service worker
    # instalado revisa para detectar una versión nueva (PwaUpdateService.checkForUpdate). Si
    # quedan cacheados, un cliente con la app ya instalada puede tardar días en enterarse de un
    # deploy nuevo. Van ANTES de la regla de abajo porque nginx usa la primera location que matchea.
    location ~* ^/(ngsw\.json|ngsw-worker\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # index.html tampoco debe cachearse — sin esta regla, nginx solo manda Last-Modified/ETag (sin
    # Cache-Control/Expires), y algunos navegadores igual aplican caché heurística para HTML sin
    # cabeceras explícitas (crece con el tiempo desde el último deploy). `location =` (match exacto,
    # máxima prioridad en nginx) alcanza tanto un GET directo a /index.html como el fallback interno
    # de `try_files ... /index.html` de más abajo (ese fallback SÍ re-evalúa las location de nginx).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El resto de JS/CSS con hash en el nombre (outputHashing: all) sí puede cachearse agresivo
    # — un cambio de contenido siempre implica un nombre de archivo distinto.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
