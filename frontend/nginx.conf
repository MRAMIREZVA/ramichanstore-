server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip: el bundle inicial ronda ~525kB, vale la pena comprimirlo en tránsito.
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Todo lo que empieza con /api va al backend (mismo origen desde el navegador,
    # por eso environment.production.ts usa apiBaseUrl: '/api' sin host).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8M;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (Angular Router resuelve /productos, /portal, etc. en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los JS/CSS llevan hash en el nombre (outputHashing: all) — cachear agresivo es seguro.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
