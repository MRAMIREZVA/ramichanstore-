<div class="catalog-shell">
  <header class="catalog-header">
    <a class="brand" routerLink="/catalogo">
      <img src="/logo.png" alt="RamichanStore" class="brand-mark" />
      <span class="brand-name">RamichanStore</span>
    </a>
    <div class="header-actions">
      @if (contactWhatsAppUrl()) {
        <a mat-button class="whatsapp-link" [href]="contactWhatsAppUrl()" target="_blank" rel="noopener" aria-label="Contáctanos">
          <mat-icon>chat</mat-icon>
          <span class="label">Contáctanos</span>
        </a>
      }
      <a
        mat-button
        routerLink="/catalogo/carrito"
        [matBadge]="cartTotalItems() > 0 ? cartTotalItems() : null"
        matBadgeColor="warn"
        matBadgeSize="small"
        aria-label="Carrito"
      >
        <mat-icon>shopping_cart</mat-icon>
        <span class="label">Carrito</span>
      </a>
      <a mat-button routerLink="/portal/login" aria-label="Mis compras">
        <mat-icon>receipt_long</mat-icon>
        <span class="label">Mis compras</span>
      </a>
    </div>
  </header>

  <main class="catalog-content">
    <router-outlet />
  </main>

  <footer class="catalog-footer">
    <span>RamichanStore — catálogo de figuras y coleccionables</span>
  </footer>
</div>
