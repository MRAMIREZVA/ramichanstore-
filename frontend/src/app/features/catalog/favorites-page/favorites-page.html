<h1 class="font-display mb-6 text-2xl font-extrabold text-gray-900 sm:text-3xl">Tus favoritos</h1>

@if (items().length === 0) {
  <div class="flex flex-col items-center gap-3 rounded-3xl border border-black/5 bg-white py-20 text-center shadow-sm">
    <mat-icon class="!h-12 !w-12 !text-[48px] text-gray-300">favorite_border</mat-icon>
    <p class="text-gray-500">Todavía no guardaste ningún producto.</p>
    <a mat-flat-button color="primary" class="!rounded-xl" routerLink="/catalogo">Ver catálogo</a>
  </div>
} @else {
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">
    @for (item of items(); track item.productId) {
      <div class="relative rounded-2xl border border-black/5 bg-white p-2 shadow-sm">
        <button
          mat-icon-button
          matTooltip="Quitar de favoritos"
          class="!absolute !right-1 !top-1 !z-10 !h-7 !w-7 !bg-white/90 text-gray-400 hover:text-red-500"
          (click)="remove(item)"
        >
          <mat-icon class="!text-[16px]">close</mat-icon>
        </button>
        <a [routerLink]="['/catalogo', item.productId]" class="block">
          <div class="relative aspect-square overflow-hidden rounded-xl bg-gray-100">
            @if (item.mainImageUrl) {
              <img class="absolute inset-0 h-full w-full object-cover" [src]="resolveImageUrl(item.mainImageUrl)" [alt]="item.name" />
            } @else {
              <div class="absolute inset-0 flex items-center justify-center">
                <mat-icon class="!h-8 !w-8 !text-[32px] text-gray-300">image</mat-icon>
              </div>
            }
          </div>
          <p class="mt-2 line-clamp-2 text-xs font-semibold text-gray-800">{{ item.name }}</p>
          <p class="mt-0.5 text-xs font-bold text-[var(--mat-sys-primary)]">S/ {{ item.salePrice.toFixed(2) }}</p>
        </a>
      </div>
    }
  </div>
}
