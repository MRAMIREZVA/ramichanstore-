<div class="dashboard">
  <header class="dashboard-header">
    <h1>Hola, {{ currentUser()?.fullName }}</h1>
    <p>Este es el panel de RamichanStore. Los indicadores se irán activando a medida que avance cada fase del roadmap.</p>
  </header>

  <div class="stats-grid">
    @for (stat of stats; track stat.label) {
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">{{ stat.icon }}</mat-icon>
        <div class="stat-body">
          <span class="stat-label">{{ stat.label }}</span>
          <span class="stat-value">—</span>
          <span class="stat-phase">Próximamente · Fase {{ stat.phase }}</span>
        </div>
      </mat-card>
    }
  </div>
</div>
