<div class="dashboard">
  <header class="dashboard-header">
    <h1>Hola, {{ currentUser()?.fullName }}</h1>
    <p>Este es el panel de RamichanStore.</p>
  </header>

  <div class="stats-grid">
    @for (stat of stats; track stat.label) {
      <mat-card class="stat-card" [class.warn]="stat.warn?.()">
        <mat-icon class="stat-icon">{{ stat.icon }}</mat-icon>
        <div class="stat-body">
          <span class="stat-label">{{ stat.label }}</span>
          <span class="stat-value">{{ loading() ? '…' : stat.value() }}</span>
        </div>
      </mat-card>
    }
  </div>
</div>
