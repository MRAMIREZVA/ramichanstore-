<div class="portal-shell">
  <header class="portal-header">
    <div class="brand">
      <img src="/logo.png" alt="RamichanStore" class="brand-mark" />
      <span class="brand-name">RamichanStore</span>
    </div>
    <div class="user-info">
      <a mat-button routerLink="/catalogo" aria-label="Ver catálogo">
        <mat-icon>storefront</mat-icon>
        <span class="label">Ver catálogo</span>
      </a>
      <span class="customer-name">{{ customer()?.fullName }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <main class="portal-content">
    <router-outlet />
  </main>
</div>
