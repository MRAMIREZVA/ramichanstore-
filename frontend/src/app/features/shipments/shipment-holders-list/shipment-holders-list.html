<div class="holders-page">
  <div class="tab-actions">
    <p class="tab-hint">Titulares de cuentas de compra (ej. Zenmarket) usadas para consolidar embarques.</p>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nuevo titular
    </button>
  </div>

  <div class="table-card">
    @if (loading()) {
      <div class="loading"><mat-spinner diameter="36" /></div>
    } @else if (holders().length === 0) {
      <div class="empty-state">
        <mat-icon>person</mat-icon>
        <p>Todavía no hay titulares registrados.</p>
      </div>
    } @else {
      <table mat-table [dataSource]="holders()" class="holders-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let h">{{ h.name }}</td>
        </ng-container>
        <ng-container matColumnDef="zenAccount">
          <th mat-header-cell *matHeaderCellDef>Cuenta ZEN</th>
          <td mat-cell *matCellDef="let h">{{ h.zenAccount || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="notes">
          <th mat-header-cell *matHeaderCellDef>Notas</th>
          <td mat-cell *matCellDef="let h">{{ h.notes || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let h">
            <button mat-icon-button (click)="openEdit(h)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="confirmDelete(h)" matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </div>
</div>
