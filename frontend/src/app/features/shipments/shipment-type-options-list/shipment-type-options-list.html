<div class="options-page">
  <div class="tab-actions">
    <p class="tab-hint">Vías de envío disponibles para los embarques (ej. EMS, Aéreo, Marítimo).</p>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nuevo tipo de envío
    </button>
  </div>

  <div class="table-card">
    @if (loading()) {
      <div class="loading"><mat-spinner diameter="36" /></div>
    } @else if (options().length === 0) {
      <div class="empty-state">
        <mat-icon>local_shipping</mat-icon>
        <p>Todavía no hay tipos de envío registrados.</p>
      </div>
    } @else {
      <table mat-table [dataSource]="options()" class="options-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let o">{{ o.name }}</td>
        </ng-container>
        <ng-container matColumnDef="notes">
          <th mat-header-cell *matHeaderCellDef>Notas</th>
          <td mat-cell *matCellDef="let o">{{ o.notes || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let o">
            <button mat-icon-button (click)="openEdit(o)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="confirmDelete(o)" matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </div>
</div>
