<div class="shipments-container">
  <h1 class="page-title">Embarques desde Japón</h1>
  <p class="page-subtitle">Compras consolidadas vía cuentas proxy (Zenmarket) y su seguimiento hasta llegar a la tienda.</p>

  <mat-tab-group animationDuration="150ms" [preserveContent]="true">
    <mat-tab label="Embarques">
      <ng-template matTabContent>
        <div class="tab-content"><app-shipments-list /></div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Titulares (cuenta ZEN)">
      <ng-template matTabContent>
        <div class="tab-content"><app-shipment-holders-list /></div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Titulares (embarque)">
      <ng-template matTabContent>
        <div class="tab-content"><app-shipment-recipients-list /></div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Tipos de envío">
      <ng-template matTabContent>
        <div class="tab-content"><app-shipment-type-options-list /></div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Artículos pendientes">
      <ng-template matTabContent>
        <div class="tab-content"><app-pending-articles-list /></div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
