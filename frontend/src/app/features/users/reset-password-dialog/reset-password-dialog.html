<h2 mat-dialog-title>Restablecer contraseña — {{ data.user.username }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput type="password" formControlName="newPassword" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <mat-error>Mínimo 8 caracteres</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="confirm()" [disabled]="saving()">Restablecer</button>
</mat-dialog-actions>
