<h2 mat-dialog-title>{{ data.role ? 'Editar rol' : 'Nuevo rol' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="role-form">
    <div class="grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" [readonly]="isAdminRole" />
        @if (isAdminRole) {
          <mat-hint>El rol ADMIN no se puede renombrar</mat-hint>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
    </div>

    <h3 class="section-title">Permisos</h3>
    <div class="permissions-grid">
      @for (group of modules(); track group.module) {
        <div class="module-group">
          <div class="module-title">{{ group.module }}</div>
          @for (p of group.permissions; track p.id) {
            <mat-checkbox [checked]="isChecked(p.id)" (change)="toggle(p.id)">
              {{ p.description || p.code }}
            </mat-checkbox>
          }
        </div>
      }
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()" [disabled]="saving()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ data.role ? 'Guardar cambios' : 'Crear rol' }}
    }
  </button>
</mat-dialog-actions>
