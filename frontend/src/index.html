<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>RamichanStore</title>
  <meta name="description" content="Figuras y coleccionables de tus animes favoritos — catálogo, preventas y más.">
  <!-- Vista previa al compartir un link (WhatsApp, Facebook, etc.): estos crawlers no ejecutan
       JavaScript, así que solo ven este HTML estático — nunca el título por-ruta que pone Angular
       en tiempo de ejecución (ver app.routes.ts). Antes decía "Panel administrativo" acá mismo, así
       que CUALQUIER link compartido (ej. el catálogo público) mostraba eso en la tarjeta de vista
       previa. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RamichanStore">
  <meta property="og:description" content="Figuras y coleccionables de tus animes favoritos — catálogo, preventas y más.">
  <meta property="og:image" content="https://ramichanstore.com/logo.png">
  <meta name="twitter:card" content="summary">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Tipografía de marca (Fase 29) — solo catálogo público y portal de clientes, ver styles.scss -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
